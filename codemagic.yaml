# Configuration Codemagic pour Just Fart (Flutter iOS -> TestFlight)
# Build sur Mac cloud + signature AUTOMATIQUE (certificat + profil crees a la volee
# via la cle API avec --create) + envoi TestFlight.
#
# PREREQUIS (UI Codemagic, une seule fois) :
#  - Cle App Store Connect API (role App Manager, idealement Admin) ajoutee dans
#    Settings > Integrations > Developer Portal, nommee EXACTEMENT "JustFart AppStore Key".

workflows:
  ios-testflight:
    name: Just Fart iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Rend la cle App Store Connect disponible aux outils de signature.
    integrations:
      app_store_connect: JustFart AppStore Key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.justfart.app"

    scripts:
      - name: Recuperer les packages Flutter
        script: flutter pub get

      - name: Installer les pods iOS
        script: find . -name "Podfile" -execdir pod install \;

      - name: Signature automatique (cree certificat + profil si absents)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA (release)
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
