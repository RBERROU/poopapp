# Configuration Codemagic pour Just Fart (Flutter iOS -> TestFlight)
# Signature via le bloc ios_signing : Codemagic MONTE le certificat de distribution
# stocke dans "Code signing identities" + cree/recupere le profil via la cle API.
#
# PREREQUIS (deja faits dans l'UI Codemagic) :
#  - Cle App Store Connect (Admin) : integration Developer Portal "JustFart AppStore Key".
#  - Certificat "Apple Distribution" genere dans Code signing identities.

workflows:
  ios-testflight:
    name: Just Fart iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: JustFart AppStore Key

    environment:
      # Codemagic monte le certificat stocke qui correspond a ce type + bundle,
      # et cree/recupere le profil de provisionnement via l'integration.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.justfart.app
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Recuperer les packages Flutter
        script: flutter pub get

      - name: Installer les pods iOS
        script: find . -name "Podfile" -execdir pod install \;

      - name: Appliquer la signature au projet Xcode
        script: xcode-project use-profiles

      - name: Build IPA (release)
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
