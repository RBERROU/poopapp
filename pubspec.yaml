name: justfart
description: "Just Fart — enregistre, collectionne et partage tes pets."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^6.2.0          # capture audio
  audioplayers: ^6.1.0    # lecture audio
  path_provider: ^2.1.4   # dossier de stockage local
  shared_preferences: ^2.3.2  # persistance des métadonnées
  share_plus: ^10.0.2     # partage natif (WhatsApp, Insta...)
  uuid: ^4.5.0            # identifiants uniques
  intl: ^0.19.0           # formatage des dates
  geolocator: ^14.0.2     # géolocalisation (natif + web via geolocator_web)
  supabase_flutter: ^2.9.0  # backend : auth anonyme, base Postgres, stockage audio
  http: ^1.2.0            # lecture des blobs web pour l'upload
  maplibre: ^0.3.5        # carte vectorielle (style Snapchat), sans clé API

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1   # génère les icônes natives + web
  flutter_native_splash: ^2.4.1     # génère l'écran de démarrage natif

flutter:
  uses-material-design: true
  # Requis par maplibre pour la gestion des dépendances natives iOS.
  config:
    enable-swift-package-manager: true

# Icône de l'app (candy-pop, générée via tool/make_icon.py).
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "#6B2FB5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#6B2FB5"
    theme_color: "#FF4FA3"

# Écran de démarrage (fond bubble + logo).
flutter_native_splash:
  color: "#FF4FA3"
  image: "assets/icon/icon_foreground.png"
  android_12:
    color: "#FF4FA3"
    image: "assets/icon/icon_foreground.png"
