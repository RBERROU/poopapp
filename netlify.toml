# Configuration de build Netlify pour Poot (Flutter web)
# Netlify n'a pas Flutter par defaut : on le clone puis on build la version web.
# (Le cache du SDK Flutter entre builds via netlify-plugin-cache a ete tente puis
# abandonne : le plugin ne restaurait qu'une fraction des fichiers du clone,
# cassant la compilation. On reclone a chaque fois, plus lent mais fiable.)
[build]
  publish = "build/web"
  command = "rm -rf flutter && git clone https://github.com/flutter/flutter.git --depth 1 -b stable && export PATH=$PATH:$PWD/flutter/bin && flutter pub get && flutter build web --release"

# Redirige toutes les routes vers index.html (necessaire pour une app web mono-page / PWA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
